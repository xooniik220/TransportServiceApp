name: Build Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p appsource

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d appsource

      - name: Find Android project
        run: |
          GRADLEW=$(find . -type f -name gradlew | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found"
            echo "Files found:"
            find . -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "Found gradlew at: $GRADLEW"

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "GRADLEW=$GRADLEW" >> $GITHUB_ENV

          chmod +x "$GRADLEW"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          ./gradlew assembleDebug --no-daemon

      - name: Find APK
        run: |
          APK=$(find . -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK found: $APK"
          echo "APK_PATH=$APK" >> $GITHUB_ENV

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: ${{ env.PROJECT_DIR }}/**/*.apk
          if-no-files-found: error
